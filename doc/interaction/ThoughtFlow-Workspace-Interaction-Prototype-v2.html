:s.status==="working"?"正在阅读新的工作版本。内容检查已通过，但尚未定稿，不替代 v1.0 已批准的内容。":"正在阅读固定的 v1.0 定稿内容。笔记副本的后续修改不会改变此处正文。"}</div><div class="prose" id="article-body">${memberBody(s,m)}</div><footer class="doc-footer">${index>0?`<a href="${readURL(s,rev,ms[index-1].key)}">← 上一篇<strong>${ms[index-1].title}</strong></a>`:`<a href="${setURL(s,rev)}">← 返回<strong>成果集概览</strong></a>`}${ms[index+1]?`<a style="text-align:right;margin-left:auto" href="${readURL(s,rev,ms[index+1].key)}">下一篇 →<strong>${ms[index+1].title}</strong></a>`:`<a style="text-align:right;margin-left:auto" href="${setURL(s,rev)}">已读至最后一篇<strong>返回成果集概览 →</strong></a>`}</footer></article><nav class="toc" aria-label="本文章节"><div class="eyebrow">本文章节</div>${headings.map((h,i)=>`<a href="#s${i+1}" data-action="section" data-id="s${i+1}">${h}</a>`).join("")}<div style="margin-top:22px;padding-left:12px;font-size:9px;color:#abb4c1">固定版本阅读<br>支持复制链接与返回定位</div></nav></div>`;setupToc();}
function noteBody(n){if(n.body)return `<div style="white-space:pre-wrap">${esc(n.body)}</div>`;return `<h2 id="s1">从模糊目标到可观察结果</h2><p>${esc(n.description)}</p><p>好的设计需要留下可供后来者理解的判断依据。我们不仅关心“做什么”，也关心为什么这样做，以及发生失败时如何知道系统仍处于安全状态。</p><h2 id="s2">让边界足够具体</h2><ul><li>描述用户输入、前置条件和可以观察到的行为。</li><li>列出正常路径之外的失败、重复与中断场景。</li><li>明确结果的判定方法，以及需要保留的证据。</li></ul><blockquote>能够被阅读、解释和检验的设计，才容易在后续迭代中持续使用。</blockquote><h2 id="s3">把讨论连接到完整设计</h2><p>这篇笔记可以独立阅读，也可以作为专题中的补充材料。将相关思考与成套设计放在一起，能帮助读者理解设计选择的来龙去脉。</p><p><a class="text-link" href="${setURL(sets[0])}">查看「需求与执行管理平台」成果集 →</a></p>`;}

function uxStats(){return `<div class="summary-band ux-stats">${[[sets.length+notes.length,'内容总览','notes','note'],[sets.length,'文档成果集','notes','stack'],[notes.length,'独立文档','notes','note'],[sets.filter(s=>s.status==='draft').length,'草稿成果集','notes','clock']].map(([n,t,path,i])=>`<a class="stat" href="#/${path}"><span class="stat-icon">${icon(i)}</span><span><span class="stat-value">${n}</span><span class="stat-label" style="display:block">${t}</span></span></a>`).join('')}</div>`}
function homePage(){breadcrumb([{text:'总览'}]);$('#main').innerHTML=uxHeader('从讨论到完整成果','继续设计、阅读和整理已有内容；保存、检查与正式批准分别记录。',`<a class="btn primary" href="#/capture">${icon('plus',true)}开始对话</a><a class="btn" href="#/notes">浏览全部内容</a>`)+uxStats()+`<div class="ux-grid"><div class="ux-stack"><section><div class="ux-heading"><h2>最近成果</h2><a class="text-link" href="#/notes">查看全部 →</a></div><div class="library-grid">${sets.map(setCard).join('')}</div></section><section class="panel"><div class="ux-heading"><h2>继续对话</h2>${uxBtn('sessions','全部会话')}</div><a class="ux-row" href="#/capture"><span class="grow"><h3>需求与执行管理平台设计</h3><p>保留最近对话 · ${ux.archive==='saved'?'已有设计草稿，可以继续讨论':'继续需求、方案与验收讨论'}</p></span>${icon('arrow',true)}</a><a class="ux-row" href="#/capture"><span class="grow"><h3>失败恢复与验收边界</h3><p>尚未归档 · 输入已保留</p></span>${icon('arrow',true)}</a></section></div><aside class="ux-stack"><section class="panel"><div class="ux-heading"><h2>常用操作</h2></div><div class="ux-menu-links"><a href="#/capture"><strong>在对话中完成设计与归档</strong><p>根据上下文自动匹配 Profile，无需再点击生成整套。</p></a><a href="#/notes" data-ux="import"><strong>导入 Markdown</strong><p>保留原文与链接，整理为可阅读的 Thought。</p></a><a href="#/write"><strong>基于来源成文</strong><p>选择单篇或固定成果集成员，形成新的独立文档。</p></a></div></section><section class="panel"><div class="ux-heading"><h2>需要关注</h2></div><div class="ux-row"><div class="grow"><h3>4 项设计选择待决</h3><p>已保存在平台设计草稿内，不阻止阅读。</p></div><a class="text-link" href="#/set/platform/a2">查看</a></div><div class="ux-row"><div class="grow"><h3>上次内容仍可阅读</h3><p>更新失败与已有内容分别显示。</p></div>${uxBtn('activity','任务记录')}</div></section></aside></div><details class="ux-topic-manage"><summary>工作区健康与后台活动</summary><div class="ux-row"><span>本地工作区可用 · 搜索索引可用 · 示例状态</span><a class="text-link" href="#/settings/index">管理</a></div></details>`;}
function capturePage(){breadcrumb([{text:'对话'}]);const archive=ux.archive;const last=archive==='saved'?`<div class="ux-message"><small>ThoughtFlow · 归档结果</small>已根据对话整理为设计草稿，保留用户需求、设计建议、待决事项与原始对话。<div class="ux-status"><strong>需求与执行管理平台</strong><br>6 篇正文 · 1 份来源材料 · 草稿已保存 · 尚未定稿</div><div class="actions"><a class="btn primary" href="#/set/platform/a2">打开成果集</a><a class="btn" href="#/notes">在笔记中查看</a></div></div>`:archive==='generating'?`<div class="ux-message" role="status"><small>ThoughtFlow · 正在归档</small>已自动匹配工程设计成果集，正在根据上下文整理 6 篇设计草稿。<div class="ux-status">范围整理完成 → 正在生成正文 → 校验与保存<br>请继续等待，无需逐篇确认或再次点击生成。</div>${uxBtn('cancel-archive','停止本次归档')}</div>`:archive==='failed'?`<div class="ux-message"><small>ThoughtFlow · 归档未完成</small>本次返回未通过内容校验；你的输入已保留。上次保存的成果仍可阅读。<div class="actions">${uxBtn('archive','重试本次归档')}${uxBtn('failure-detail','查看失败详情')}<a class="btn" href="#/set/platform/a2">查看已有草稿</a></div></div>`:archive==='conflict'?`<div class="ux-message"><small>ThoughtFlow · 写入被保护</small>发现笔记副本有人工修改，本次未覆盖原内容。<div class="actions">${uxBtn('conflict-detail','查看冲突内容')}<a class="btn" href="#/set/platform/a2">阅读已保存原件</a></div></div>`:'';$('#main').innerHTML=uxHeader('需求与执行管理平台设计','围绕同一目标持续讨论，在对话中说“归档”即可保存设计草稿。',`${uxBtn('sessions','会话记录')}${uxBtn('new-session','新对话')}`)+`<div class="ux-chat-shell"><div class="ux-chat" aria-live="polite">${ux.chat.map(m=>`<div class="ux-message ${m.role==='user'?'user':''}"><small>${m.role==='user'?'你':'ThoughtFlow · 设计建议'}</small>${esc(m.text)}</div>`).join('')}${last}</div><div class="ux-bottom"><form id="ux-chat-form" class="ux-composer"><textarea id="ux-chat-input" aria-label="对话内容" placeholder="继续讨论，或输入“将以上讨论归档”……" ${archive==='generating'?'disabled':''}></textarea><div class="ux-form-actions"><small class="ux-help" style="margin-right:auto">Enter 发送 · Shift + Enter 换行</small><button class="btn primary" type="submit" ${archive==='generating'?'disabled':''}>发送 ${icon('arrow',true)}</button></div></form><p class="ux-help" style="margin-top:9px">对话与归档会使用已配置的模型服务。上下文由后端管理；页面仅展示对话及必要结果。</p></div></div>`;}
function archiveStart(){if(ux.archive==='generating')return;ux.archive='generating';const attempt=++ux.attempt;capturePage();setTimeout(()=>{if(attempt!==ux.attempt)return;ux.archive=ux.scenario==='invalid'?'failed':ux.scenario==='conflict'?'conflict':'saved';if(route()[0]==='capture')capturePage();},1400);}
function sessionsDialog(){dialog('会话记录',`<label class="ux-field">筛选会话<input placeholder="按会话名称搜索" id="ux-session-filter"></label><div id="ux-session-results">${['需求与执行管理平台设计','失败恢复与验收边界','身份与权限服务方案'].map((t,i)=>`<a class="ux-row" href="#/capture" data-close><span><strong>${t}</strong><p class="ux-help">${i?'未归档 · 输入已保留':'最近活跃 · 关联设计草稿'}</p></span>${icon('arrow',true)}</a>`).join('')}</div>`,`<button class="btn" data-ux="new-session">新建对话</button>`);}
function sourcePicker(){dialog('选择成文来源',`<p>按固定版本选择整套正文或其中成员。原始对话作为来源单独选择，不默认混入正文。</p><div class="ux-source-list">${sets.map(s=>`<div class="ux-heading" style="margin-top:18px"><strong>${esc(s.title)}</strong><span class="badge ${s.status}">${s.versionLabels[s.latest]}</span></div><label class="ux-choice"><input type="checkbox" name="ux-source" value="${s.id}|${s.latest}|all"><span>整套正文<small>${s.members[s.latest].length} 篇，按成员保留版本引用</small></span></label>${s.members[s.latest].map(m=>`<label class="ux-choice"><input type="checkbox" name="ux-source" value="${s.id}|${s.latest}|${m.key}"><span>${esc(m.title)}<small>固定版本 · ${s.versionLabels[s.latest]}</small></span></label>`).join('')}`).join('')}${notes.map(n=>`<label class="ux-choice"><input type="checkbox" name="ux-source" value="note||${n.id}"><span>${esc(n.title)}<small>独立文档 · 添加时冻结引用</small></span></label>`).join('')}</div>`,`<button class="btn" data-action="close-dialog">取消</button>${uxBtn('accept-sources','添加所选来源','',true)}`);}
function sourceTitle(v){const [id,rev,key]=v.split('|');return id==='note'?getNote(key)?.title:key==='all'?getSet(id)?.title+' · 整套正文':getSet(id)?.members[rev]?.find(m=>m.key===key)?.title;}
function writePage(){breadcrumb([{text:'笔记',url:'#/notes'},{text:'基于来源成文'}]);const generated=ux.composeState==='ready'||ux.composeState==='saved';$('#main').innerHTML=uxHeader('基于来源成文','将选定材料整理成一篇独立文档；不会改写来源或替代原成果集。',`<a class="btn" href="#/notes">返回笔记</a>`)+`<div class="ux-grid"><section class="panel"><div class="ux-heading"><h2>来源与写作意图</h2>${uxBtn('pick-sources','添加来源')}</div><div class="ux-source-tray">${ux.sources.map((v,i)=>`<button data-ux="remove-source" data-index="${i}" title="移除此来源">${esc(sourceTitle(v)||'来源不可用')} ×</button>`).join('')||'<p class="ux-help">尚未选择来源，可从笔记、搜索结果或成果集成员添加。</p>'}</div><label class="ux-field">写作目标<textarea id="ux-write-intent" placeholder="例如：根据平台设计与验收方案整理一份实施前审查说明">${esc(ux.intent||'提炼设计目标、关键边界和待验证内容，形成实施前审查说明。')}</textarea></label><div class="ux-form-actions">${uxBtn('generate-writing',ux.composeState==='generating'?'正在生成…':'生成独立文档',ux.composeState==='generating'?'disabled':'',true)}</div>${ux.composeState==='failed'?'<div class="ux-status error">本次生成未通过校验，来源与写作意图已保留。可查看详情后重试。</div>':''}</section><aside class="panel"><h2 style="font-size:15px">如何处理来源</h2><p class="ux-help" style="margin-top:12px">成果集按选择的固定版本读取；整套添加时展开为成员引用。相同成员去重。来源缺失或不可达时明确提示，不静默换成最新正文。</p><p class="ux-help" style="margin-top:12px">生成内容先作为独立草稿预览，点击保存后才出现在笔记中。正式文档的审查与定稿从该文档的管理入口继续。</p></aside></div>${ux.composeState==='generating'?'<div class="ux-status" role="status">正在整理所选来源，预览会保留固定版本信息……</div>':''}${generated?`<section class="panel ux-section"><div class="ux-heading"><h2>${ux.composeState==='saved'?'已保存到笔记':'独立草稿预览'}</h2><div class="actions">${uxBtn('toggle-write-editor',ux.writeEdit?'阅读预览':'编辑正文')}${uxBtn('save-writing','保存到笔记','',true)}</div></div>${ux.writeEdit?`<textarea class="ux-doc-editor" id="ux-writing-body" aria-label="草稿正文">${esc(ux.composeText)}</textarea>`:`<div class="prose" style="white-space:pre-wrap">${esc(ux.composeText)}</div>`}<p class="ux-help" style="margin-top:15px">来源：${ux.sources.map(sourceTitle).map(esc).join(' · ')}</p></section>`:''}`;}
function fullSearch(query=''){breadcrumb([{text:'搜索'}]);$('#global-query').value=query;const q=query.toLowerCase();let rows=[];if(query){for(const s of sets)for(const m of s.members[s.latest])if((s.title+m.title+m.summary).toLowerCase().includes(q))rows.push({kind:'member',title:m.title,context:s.title+' › '+m.role,summary:m.summary,href:readURL(s,s.latest,m.key),source:`${s.id}|${s.latest}|${m.key}`,state:statusBadge(s)});for(const n of notes)if((n.title+n.description+n.tags.join('')).toLowerCase().includes(q))rows.push({kind:'note',title:n.title,context:'独立文档',summary:n.description,href:'#/note/'+n.id,source:`note||${n.id}`,state:''});}if(ux.searchType)rows=rows.filter(r=>r.kind===ux.searchType);$('#main').innerHTML=uxHeader('搜索内容','搜索结果保留所属成果集、版本与正文位置。列表筛选与全局搜索使用不同入口。')+`<form id="ux-search-form" class="ux-toolbar"><input class="ux-input" id="ux-search-query" aria-label="搜索词" value="${esc(query)}" placeholder="搜索标题、正文或标签"><button class="btn primary" type="submit">搜索</button><select class="version-select" id="ux-search-type" aria-label="搜索内容类型"><option value="">全部正文</option value="member" ${ux.searchType==='member'?'selected':''}>成果集成员</option><option value="note" ${ux.searchType==='note'?'selected':''}>独立文档</option></select></form><div class="ux-heading"><span class="ux-help">${query?rows.length+' 条结果':'输入关键词，或试试“接口”“验收”“需求”'}</span><a class="text-link" href="#/write">成文来源 ${ux.sources.length} →</a></div>${ux.scenario==='empty'&&query?'<div class="empty">没有找到相关内容。可调整关键词或类型。</div>':rows.map(r=>`<article class="search-result"><div class="actions" style="justify-content:space-between"><span class="ux-help">${esc(r.context)}</span>${r.state}</div><h3 style="margin-top:8px"><a href="${r.href}">${esc(r.title)}</a></h3><p>${esc(r.summary)}</p><div class="ux-form-actions"><a class="text-link" href="${r.href}">打开固定阅读 →</a>${uxBtn('search-add','加入成文来源',`data-source="${r.source}"`)}</div></article>`).join('')}${!query?'<div class="ux-menu-links"><a href="#/search/接口">查找接口契约 →</a><a href="#/search/验收">查找验收与证据 →</a></div>':''}`;}
const settingsTabs=[['general','通用'],['models','模型与外部请求'],['git','同步与版本'],['index','索引与后台任务'],['profiles','文档规则'],['recovery','备份与恢复']];
function settingsPage(tab='general'){if(!settingsTabs.some(([k])=>k===tab))tab='general';breadcrumb([{text:'设置'}]);let body='';if(tab==='general')body=`<section class="panel"><h2>工作区与阅读</h2><p class="ux-help">当前工作区：个人知识工作区 · 内容保存在本地</p><label class="ux-field">界面语言<select><option>简体中文</option><option>English</option></select></label><label class="ux-choice"><input type="checkbox" checked><span>显示必要的操作说明<small>不把调试或系统状态放到阅读首屏</small></span></label>${uxBtn('save-settings','保存偏好')}</section>`;else if(tab==='models')body=`<section class="panel"><h2>模型与 Provider</h2><label class="ux-field">服务地址<input id="ux-endpoint" type="url" value="${esc(ux.settings.endpoint)}"></label><label class="ux-field">模型<input id="ux-model" value="${esc(ux.settings.model)}"></label><label class="ux-field">访问凭据<input type="password" value="example-only" autocomplete="off"></label><p class="ux-help">原型仅演示字段分组与提交反馈。产品中的可写字段由配置 API 决定；需重启生效的字段明确标注，不能伪装成已热更新。</p><div class="ux-form-actions">${uxBtn('test-model','检查连接')}${uxBtn('save-settings','保存配置','',true)}</div></section><section class="panel"><h2>外部请求范围</h2><p class="ux-help">对话、设计生成与语义审查会发送必要内容到模型服务；URL 提取会联系源站或 Reader。向量索引与文本模型分开配置。</p><details><summary>结构化输出与调用诊断</summary><p class="ux-help">Responses 接口；归档要求 JSON object。参数不支持、格式错误与临时故障分别呈现；不以反复原样重试隐藏失败。</p></details></section>`;else if(tab==='git')body=`<section class="panel"><h2>同步与版本</h2><div class="ux-row"><span>本地版本记录</span><span class="badge final">可用 · 示例</span></div><div class="ux-row"><span>最近同步</span><span class="ux-help">尚未配置远端</span></div><label class="ux-field">远端地址<input placeholder="未配置" value=""></label><div class="ux-form-actions">${uxBtn('sync-preview','查看待同步范围')}${uxBtn('sync-preview','检查同步状态')}</div><p class="ux-help">展示状态与内容范围后再执行已有同步操作；凭据错误、网络故障与内容冲突分别提示。</p></section>`;else if(tab==='index')body=`<section class="panel"><h2>检索与索引</h2><div class="ux-row"><span>词法索引</span><span class="badge final">可用 · 示例</span></div><div class="ux-row"><span>向量索引</span><span class="badge working">部分内容待处理</span></div>${uxBtn('index-preview','查看重建范围')}</section><section class="panel"><h2>后台活动</h2><p class="ux-help">归档任务、索引与同步各自记录；索引失败不将已保存内容标成丢失。</p><div class="ux-form-actions">${uxBtn('activity','查看任务记录')}${uxBtn('metrics','查看调用统计')}</div></section>`;else if(tab==='profiles')body=`<section class="panel"><h2>文档规则与模板</h2><p class="ux-help">归档自动按对话上下文匹配 Profile。这里用于维护规则，不要求用户归档前手工选择。</p>${['工程设计与交付成果集 · 6 类成员','软件功能设计 · 单篇','普通 Markdown 笔记 · 原文保留'].map(t=>`<div class="ux-row"><span>${t}</span>${uxBtn('profile-detail','查看规则')}</div>`).join('')}</section>`;else body=`<section class="panel"><h2>备份与恢复</h2><p class="ux-help">阅读下载、正式交付与备份的内容范围不同。恢复前先校验包和冲突，保留当前工作区的后续修改。</p><div class="ux-form-actions">${uxBtn('backup-preview','导出工作区备份')}${uxBtn('restore-preview','校验与恢复备份')}</div></section><section class="panel"><h2>活动与中断恢复</h2><p class="ux-help">可以查看操作身份、阶段与失败原因；安全终止的业务冲突不应阻止整个工作区使用。</p>${uxBtn('activity','查看操作记录')}</section>`;$('#main').innerHTML=uxHeader('设置','模型、外部请求、同步、规则与恢复统一管理；阅读页面保持简洁。')+`<div class="ux-settings"><nav class="ux-settings-nav" aria-label="设置分类">${settingsTabs.map(([k,t])=>`<a href="#/settings/${k}" class="${k===tab?'active':''}">${t}</a>`).join('')}</nav><div class="ux-settings-main">${body}</div></div>`;}
function helpPage(){breadcrumb([{text:'帮助'}]);$('#main').innerHTML=uxHeader('使用 ThoughtFlow','从一段讨论开始，逐步形成可阅读、可追踪的单篇或整套文档。')+`<div class="ux-grid"><section class="panel"><div class="ux-menu-links"><a href="#/capture"><strong>1. 在对话中设计与归档</strong><p>自动抽取上下文并匹配 Profile；草稿保留未决内容。</p></a><a href="#/notes"><strong>2. 在笔记中发现内容</strong><p>独立文档和成果集共同浏览；原始对话单独归入来源。</p></a><a href="#/topics"><strong>3. 在专题中组织完整方案</strong><p>选择跟随归档、工作版本、定稿或固定历史版本。</p></a><a href="#/write"><strong>4. 选择来源形成新文档</strong><p>不修改来源，保存后作为新的独立 Thought。</p></a></div></section><aside class="panel"><h2 style="font-size:15px">三个状态分别理解</h2><div class="ux-row"><span>内容已保存</span><span class="ux-help">可以阅读与下载</span></div><div class="ux-row"><span>检查已通过</span><span class="ux-help">对当前版本的检查结果</span></div><div class="ux-row"><span>已正式批准</span><span class="ux-help">对应明确版本与交付等级</span></div><p class="ux-help">本原型仅演示交互，不代表真实生成、审查或正式批准。</p></aside></div>`;}
function topicManagement(t){$('#main').insertAdjacentHTML('beforeend',`<details class="ux-topic-manage"><summary>管理此专题 · 内容、规则与恢复</summary><div class="ux-form-actions">${uxBtn('topic-add','添加已有内容',`data-id="${t.id}"`)}${uxBtn('topic-rules','关联规则与候选',`data-id="${t.id}"`)}${uxBtn('topic-references','参考资料目录',`data-id="${t.id}"`)}${uxBtn('topic-edit','编辑专题',`data-id="${t.id}"`)}${uxBtn('backup-preview','备份此专题')}${uxBtn('topic-delete','删除专题',`data-id="${t.id}"`)}</div></details>`);}
function statesDialog(){dialog('交互状态示例',`<p>仅切换原型中的示例状态，不操作产品服务。当前：${esc(ux.scenario)}</p><div class="ux-state-grid">${[['normal','正常链路','演示对话 → 自动归档 → 笔记发现'],['invalid','归档输出不合法','保留输入与旧成果，显示可重试失败'],['conflict','发现人工修改','不覆盖内容，提供冲突核对入口'],['empty','搜索无结果','保留查询，提示调整条件']].map(([k,t,s])=>`<button class="btn" data-ux="set-scenario" data-value="${k}"><span><strong>${t}</strong><small>${s}</small></span></button>`).join('')}</div><div class="ux-menu-links" style="margin-top:20px"><a href="#/settings/recovery" data-close>备份、导入冲突与恢复 →</a><a href="#/set/identity/w2" data-close>工作版本、审查与正式交付 →</a></div>`);}
function reviewDialog(){dialog('审查与正式交付 · 工作版本',`<p>当前：身份与权限服务 · 11月04日工作版本 · 5 篇正文。定稿会固定整套版本，不等于生产部署授权。</p><div class="ux-status ${ux.reviewed?'':'warn'}">${ux.reviewed?'示例风险处置已记录，当前版本可提交定稿申请。':'检查已完成；仍有 1 项来源风险需要处置。硬错误不能用普通确认绕过。'}</div><div class="ux-review-issue"><h3>来源链接尚未验证</h3><p>接口与错误契约 › 认证依据 · 当前候选固定位置</p><label class="ux-field">风险说明<textarea id="ux-risk-reason" placeholder="说明适用范围、后续核对方法及接受此风险的原因"></textarea></label><label class="ux-choice"><input id="ux-risk-check" type="checkbox" ${ux.reviewed?'checked':''}><span>已核对该位置并记录处置说明</span></label></div>`,`<button class="btn" data-action="close-dialog">返回阅读</button>${uxBtn('record-review','记录风险处置')}${uxBtn('finalize-preview','提交定稿申请','',true)}`);}
function importDialog(){dialog('导入 Markdown',`<p>支持一个或多个 .md / .markdown 文件。保留原文件字节与完整正文，不要求已有 Thought 格式。</p><label class="ux-field">Markdown 文件<input id="ux-import-files" type="file" accept=".md,.markdown,text/markdown" multiple></label><div class="ux-status warn">本地图片与附件不会随仅选中的 Markdown 自动上传。原有链接完整保留，并提示未导入附件。</div><div id="ux-import-result" aria-live="polite"></div>`,`<button class="btn" data-action="close-dialog">取消</button>${uxBtn('import-confirm','导入到原型笔记','',true)}`);}

const uxRefs={};
function uxRef(t,s){return uxRefs[t.id+':'+s.id]||(s.id==='identity'?{policy:'pinned',version:'v1'}:{policy:'latest_archive',version:''});}
function uxRefVersion(s,r){if(r.policy==='pinned')return s.members[r.version]?r.version:'';if(r.policy==='latest_archive')return s.id==='platform'?'a2':'';if(r.policy==='latest_working')return s.id==='identity'?'w2':'';if(r.policy==='latest_finalized')return s.id==='identity'?'v1':'';return '';}
function topicPage(t){const ss=t.setIds.map(getSet).filter(Boolean),ns=t.noteIds.map(getNote).filter(Boolean);breadcrumb([{text:'专题',url:'#/topics'},{text:t.title}]);$('#main').innerHTML=`<a class="backline" href="#/topics">${icon('back',true)}全部专题</a><section class="topic-hero"><div class="eyebrow">TOPIC / 专题</div><h1 style="margin-top:9px">${esc(t.title)}</h1><p>${esc(t.description)}</p><div class="card-meta"><span>${ss.length} 个成果集</span><i class="dot"></i><span>${ns.length} 篇独立文档</span></div></section><section class="topic-section"><div class="section-heading"><h2>文档成果集</h2>${uxBtn('topic-add','添加已有内容',`data-id="${t.id}"`)}</div>${ss.map(s=>{const ref=uxRef(t,s),rev=uxRefVersion(s,ref),policy={latest_archive:'跟随最新归档草稿',latest_working:'跟随工作版本',latest_finalized:'跟随定稿',pinned:'固定版本'}[ref.policy];return `<div class="topic-set-box"><div class="set-symbol">${icon('stack')}</div><div class="grow"><h3>${rev?`<a href="${setURL(s,rev)}">${esc(s.title)}</a>`:esc(s.title)}</h3><p>${rev?s.members[rev].length+' 篇正文 · '+s.versionLabels[rev]:'指定类型的版本不可用；未替换成其他内容'}</p><span class="binding">${icon(ref.policy==='pinned'?'link':'clock',true)}${policy}</span></div><div class="actions">${uxBtn('reference-policy','版本引用',`data-id="${t.id}" data-set="${s.id}"`)}${rev?`<a class="btn primary small" href="${setURL(s,rev)}">打开成果集 →</a>`:''}</div></div><p class="topic-explainer">${ref.policy==='pinned'?'该专题固定引用所选内容，新版本不自动替换。':'仅跟随指定类型的版本；已打开或复制的阅读链接保持固定。'}</p>`;}).join('')||'<div class="empty" style="padding:25px">尚未关联成果集，可添加已有整套内容。</div>'}</section><section class="topic-section"><div class="section-heading"><h2>独立文档</h2><small>${ns.length} 篇 · 补充设计思考</small></div><div class="library-grid">${ns.map(noteCard).join('')||'<p class="muted">暂未添加独立文档。</p>'}</div></section><section class="topic-section"><div class="section-heading"><h2>参考资料</h2><small>背景与来源，单独归类</small></div>${ss.length?`<button class="reference" style="width:100%;text-align:left" data-action="source" data-id="${ss[0].id}">${icon('source')}<span><strong>设计讨论与原始需求</strong><p>原始对话 · 保留需求与建议的来源</p></span>${icon('arrow',true)}</button>`:'<p class="ux-help">当前没有关联来源材料，可以从管理区维护参考目录。</p>'}</section>`;}
document.addEventListener('click',e=>{const b=e.target.closest('[data-ux]');if(!b)return;const t=getTopic(b.dataset.id),s=getSet(b.dataset.set);if(b.dataset.ux==='reference-policy'){const ref=uxRef(t,s);dialog('专题版本引用策略',`<p>「${esc(t.title)}」引用「${esc(s.title)}」。四种策略各自有确定含义；没有对应版本时显示不可用，不静默更换。</p><label class="ux-field">引用方式<select id="ux-ref-policy">${[['latest_archive','跟随最新归档草稿'],['latest_working','跟随工作版本'],['latest_finalized','跟随定稿'],['pinned','固定版本']].map(([k,n])=>`<option value="${k}" ${ref.policy===k?'selected':''}>${n}</option>`).join('')}</select></label><label class="ux-field">固定版本（仅固定策略使用）<select id="ux-ref-version">${Object.keys(s.members).map(rev=>`<option value="${rev}" ${ref.version===rev?'selected':''}>${s.versionLabels[rev]} · ${s.members[rev].length} 篇正文</option>`).join('')}</select></label>`,uxBtn('reference-save','保存示例引用',`data-id="${t.id}" data-set="${s.id}"`,true));}else if(b.dataset.ux==='reference-save'){uxRefs[t.id+':'+s.id]={policy:$('#ux-ref-policy').value,version:$('#ux-ref-version').value};closeDialog();render();toast('引用策略已更新，已打开的固定链接不变');}});

function render(){
 closeSide();if($("#dialog").open)closeDialog();editing=false;if(window.tocObserver)window.tocObserver.disconnect();$("#main").className="main";
 const [page,id,rev,key,section]=route();const s=getSet(id);$$("[data-nav]").forEach(a=>a.classList.toggle("active",a.dataset.nav===(["topics","topic"].includes(page)?"topics":["notes","note","set","read","copy","write"].includes(page)?"notes":page)));
 $("#nav-note-count").textContent=sets.length+notes.length;
 if(page==="overview"||!page)homePage();else if(page==="capture")capturePage();else if(page==="write")writePage();else if(page==="settings")settingsPage(id);else if(page==="help")helpPage();else if(page==="notes")library();else if(page==="topics")topicList();else if(page==="topic"&&getTopic(id))topicPage(getTopic(id));else if(page==="set"&&s&&s.members[rev])overview(s,rev);else if(page==="read"&&s&&s.members[rev])reader(s,rev,key);else if(page==="copy"&&s&&s.members[rev])copyReader(s,rev,key);else if(page==="note"&&getNote(id))single(getNote(id));else if(page==="search")fullSearch(id||"");else missing();

 if(page==="notes"){$('#main .page-heading .actions').innerHTML=`<a class="btn primary" href="#/capture">${icon('plus',true)}从对话创建</a>${uxBtn('import','导入 Markdown')}<a class="btn" href="#/write">基于来源成文</a>`;}
 if(page==="topics"){$('#main .page-heading').insertAdjacentHTML('beforeend',`<div class="actions">${uxBtn('topic-new','创建专题','',true)}</div>`);}
 if(page==="topic"&&getTopic(id))topicManagement(getTopic(id));
 if(page==="note"&&getNote(id))$('#main').insertAdjacentHTML('beforeend',`<div class="ux-form-actions">${uxBtn('add-note-source','加入成文来源',`data-id="${id}"`)}${uxBtn('formal-convert','转换为正式文档')}${uxBtn('note-process','来源与处理记录')}${uxBtn('share-preview','分享范围示例')}${uxBtn('note-delete','删除影响核对')}</div>`);
 if(page==="read"&&s&&s.members[rev]?.some(m=>m.key===key))$('#main').insertAdjacentHTML('beforeend',`<div class="ux-form-actions">${uxBtn('add-member-source','将当前成员加入成文来源',`data-id="${id}" data-rev="${rev}" data-key="${key}"`)}</div>`);
 if(page==="set"&&id==="identity")$('#main').insertAdjacentHTML('beforeend',`<details class="ux-topic-manage"><summary>审查、定稿与交付</summary><div class="ux-form-actions">${uxBtn('review','审查当前工作版本')}${uxBtn('delivery','下载与正式交付')}${uxBtn('handoff','工程移交')}</div></details>`);
 $('#main').insertAdjacentHTML('beforeend','<p class="ux-preview-banner">全功能交互设计 v2 · 待确认 · 示例数据与操作仅在当前页面内存中生效，不连接真实服务。 <a href="#" data-ux="states">切换状态示例</a></p>');
 window.scrollTo({top:0,behavior:"instant"});if(page==="read"&&/^s[1-4]$/.test(section||"")){requestAnimationFrame(()=>$("#"+section)?.scrollIntoView({behavior:"instant"}));}document.title=(($("#main h1")?.textContent)||"笔记")+" · ThoughtFlow 交互原型";updateProgress();
}
function updateProgress(){const isReader=["read","note","copy"].includes(route()[0]),height=document.documentElement.scrollHeight-innerHeight;$("#read-progress").style.width=isReader&&height>0?Math.min(100,scrollY/height*100)*(innerWidth-(innerWidth>800?parseInt(getComputedStyle(document.documentElement).getPropertyValue("--sidebar")):0))/100+"px":"0";}
document.addEventListener("click",async e=>{
 const btn=e.target.closest("[data-action]"),a=e.target.closest("a[data-close]");if(a)closeDialog();if(!btn)return;
 const action=btn.dataset.action,id=btn.dataset.id,rev=btn.dataset.rev,key=btn.dataset.key,base=getSet(id),s=base&&rev==="w2"?{...base,status:"working"}:base;
 if(action!=="section")e.preventDefault();
 if(action==="show-failed-update"){failedUpdate=true;closeDialog();nav("#/set/platform/a2");}else if(action==="failure-info")dialog("最近一次更新未完成",`<p>这是后台任务状态的展示示例。</p><div class="question">本次更新在生成阶段中断，未替换上次保存的 6 篇草稿。已有正文、原始对话与笔记副本保持可读。</div><div class="question">后续重试应继续独立记录进展；已有成果的保存状态保持“草稿已保存”。</div>`);else if(action==="guide")guide();else if(action==="close-dialog")closeDialog();else if(action==="close-side")closeSide();else if(action==="toggle-side"){$("#sidebar").classList.toggle("open");$("#drawer-backdrop").classList.toggle("open");}
 else if(action==="expand"){expanded.has(id)?expanded.delete(id):expanded.add(id);libraryResults();}
 else if(action==="filter"){view.filter=id;library();}else if(action==="layout"){view.layout=id;library();}else if(action==="clear-filter"){view.query="";view.filter="all";library();}
 else if(action==="source")source(id);else if(action==="source-explainer")dialog("正文与来源分开阅读",`<p>成果集中的设计文档是正文。归档时保留的原始对话作为来源材料单独列出，可以从成果集概览、成员目录或专题的参考资料进入。</p><p>正文篇数不包含原始对话，避免把形成设计的讨论当作已经整理的正式文档。</p>`);
 else if(action==="copy-link"){try{await navigator.clipboard.writeText(location.href);toast("已复制当前页面链接，包含所选版本");}catch{dialog("复制阅读链接",`<p>链接保留当前内容与版本定位。</p><input type="text" value="${esc(location.href)}" readonly aria-label="当前页面链接" style="width:100%">`);}}
 else if(action==="binding")binding(id);else if(action==="save-binding"){topicBindings[id]=$("input[name=binding]:checked").value;closeDialog();render();toast("已更新此专题的版本引用方式");}
 else if(action==="reader-nav")dialog("文档目录",`<a class="tour-link" href="${setURL(s,rev)}" data-close>${icon("stack",true)}成果集概览</a>${s.members[rev].map((m,i)=>`<a class="tour-link" href="${readURL(s,rev,m.key)}" data-close><span>${i+1}</span><strong>${m.title}</strong></a>`).join("")}`);
 else if(action==="reader-toc")dialog("本文章节",headings.map((h,i)=>`<button class="btn" style="display:flex;width:100%;justify-content:flex-start;margin:8px 0" data-action="section" data-id="s${i+1}">${i+1}. ${h}</button>`).join(""));
 else if(action==="section"){e.preventDefault();closeDialog();const [p,sid,r,k]=route();if(p==="read")nav(readURL(getSet(sid),r,k)+"/"+id);else $("#"+id)?.scrollIntoView({behavior:"smooth"});}
 else if(action==="open-copy")nav(`#/copy/${id}/${rev}/${key}`);
 else if(action==="edit-copy"){editing=true;copyReader(s,rev,key);$("#copy-editor").focus();}
 else if(action==="save-copy"){if(!$("#copy-editor").value.trim()){toast("正文不能为空，原副本内容已保留");return;}copies[id+":"+rev+":"+key]=$("#copy-editor").value;editing=false;copyReader(s,rev,key);toast("笔记副本已在原型中保存，归档原件保持固定");}
 else if(action==="cancel-edit"){editing=false;const [,sid,r,k]=route();copyReader(getSet(sid),r,k);}
 else if(action==="new-note"||action==="edit-note"){const n=action==="edit-note"?getNote(id):null;dialog(n?"编辑笔记":"新建笔记",`<p>在此原型中体验独立 Thought 的保存与阅读。输入仅保留在当前页面，刷新后重置。</p><label>标题<input id="note-title" type="text" value="${esc(n?.title||"")}" placeholder="给这篇笔记起一个名字"></label><label>内容<textarea id="note-body" placeholder="记录一个想法……">${esc(n?(n.body||plainBody(noteBody(n))):"")}</textarea></label>`,`<button class="btn" data-action="close-dialog">取消</button><button class="btn primary" data-action="save-note" data-id="${n?.id||""}">保存笔记</button>`);}
 else if(action==="save-note"){const title=$("#note-title").value.trim(),body=$("#note-body").value.trim();if(!title||!body){toast("请填写标题和正文");return;}let n=getNote(id);if(n){n.title=title;n.body=body;n.description=body.slice(0,90);}else{n={id:"new-"+Date.now(),title,body,description:body.slice(0,90),type:"独立笔记",date:"刚刚",time:"",minutes:1,tags:["我的笔记"]};notes.unshift(n);}closeDialog();nav("#/note/"+n.id);toast("已保存原型示例笔记");}
 else if(action==="download-note"){const n=getNote(id);download(n.title+".md","# "+n.title+"\n\n"+plainBody(noteBody(n)));}
 else if(action==="download-set"){dialog(s.status==="draft"?"下载设计草稿":s.status==="working"?"下载工作版本":"下载定稿文档",`<p>将当前所选版本的成员正文汇总为一份可阅读的 Markdown 文件。</p><div class="choice"><strong>${s.title}</strong><small style="margin-left:0">${s.versionLabels[rev]} · ${s.members[rev].length} 篇正文</small></div><p>${s.status!=="final"?"当前内容保留来源说明；下载不代表正式交付或批准。":"文件将注明 v1.0 定稿身份；正式批准范围以定稿记录为准。"}</p>`,`<button class="btn" data-action="close-dialog">取消</button><button class="btn primary" data-action="confirm-download" data-id="${id}" data-rev="${rev}">${icon("download",true)}下载示例 Markdown</button>`);}
 else if(action==="confirm-download"){closeDialog();download(s.title+"-"+rev+".md","# "+s.title+"\n\n> 交互原型示例内容 · "+s.versionLabels[rev]+"\n\n"+s.members[rev].map(m=>"## "+m.title+"\n\n"+plainBody(memberBody(s,m))).join("\n\n---\n\n"));}
 else if(action==="final-info")dialog("v1.0 · 定稿依据",`<p>这是定稿记录的展示示例，内容检查、保存和批准分别表达。</p><div class="status-line">${icon("check")}<div><strong>内容检查通过</strong><p>4 篇成员的范围、引用与验证关系已核对。</p></div></div><div class="status-line">${icon("check")}<div><strong>批准范围：服务设计文档</strong><p>文档批准不代表生产部署或外部执行授权。</p></div></div><div class="status-line">${icon("clock")}<div><strong>定稿于 11月02日 15:30</strong><p>后续笔记编辑不会自动改变本版本。</p></div></div>`);
});

document.addEventListener('submit',e=>{if(e.target.id==='ux-chat-form'){e.preventDefault();const input=$('#ux-chat-input'),text=input.value.trim();if(!text)return;ux.chat.push({role:'user',text});if(/归档/.test(text)){archiveStart();}else{ux.chat.push({role:'assistant',text:'已将这段补充纳入当前讨论。归档时会自动整理用户需求与设计建议，保留尚未确定的边界；你可以继续讨论，或要求归档。'});capturePage();}}if(e.target.id==='ux-search-form'){e.preventDefault();const q=$('#ux-search-query').value.trim();nav('#/search/'+encodeURIComponent(q));}});
document.addEventListener('keydown',e=>{if(e.target.id==='ux-chat-input'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();e.target.form.requestSubmit();}});
document.addEventListener('input',e=>{if(e.target.id==='ux-session-filter'){const q=e.target.value;$$('#ux-session-results a').forEach(a=>a.hidden=!a.textContent.includes(q));}if(e.target.id==='ux-writing-body')ux.composeText=e.target.value;if(e.target.id==='ux-write-intent')ux.intent=e.target.value;});
document.addEventListener('change',e=>{if(e.target.id==='ux-search-type'){ux.searchType=e.target.value;fullSearch(route()[1]||'');}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-ux]');if(!b)return;e.preventDefault();const action=b.dataset.ux,id=b.dataset.id;
 if(action==='states')statesDialog();
 else if(action==='set-scenario'){ux.scenario=b.dataset.value;closeDialog();toast('已切换原型状态：'+ux.scenario);if(ux.scenario==='empty')nav('#/search/接口');else{ux.archive='idle';nav('#/capture');}}
 else if(action==='sessions')sessionsDialog();
 else if(action==='new-session'){ux.chat=[];ux.archive='idle';ux.attempt++;closeDialog();nav('#/capture');}
 else if(action==='archive')archiveStart();
 else if(action==='cancel-archive'){ux.attempt++;ux.archive='failed';capturePage();toast('示例任务已停止，已有内容与输入保留');}
 else if(action==='failure-detail')uxNotice('本次归档未完成','结构化输出未通过校验。当前输入已保留，本次结果未用于更新已保存成果。请求身份、失败阶段与错误类型放在这里，避免在对话气泡中堆叠原始日志。');
 else if(action==='conflict-detail')uxNotice('保留人工修改','检测到可编辑副本与投影前内容不一致。保留当前副本；已冻结原件仍可读取。恢复不得自动覆盖不同的用户字节。',`<a class="btn" href="#/copy/platform/a2/storage" data-close>查看笔记副本</a><a class="btn primary" href="#/read/platform/a2/storage" data-close>查看固定原件</a>`);
 else if(action==='pick-sources')sourcePicker();
 else if(action==='accept-sources'){const values=$$('input[name="ux-source"]:checked').map(n=>n.value);const expanded=values.flatMap(v=>{const [sid,rev,key]=v.split('|');return key==='all'?getSet(sid).members[rev].map(m=>`${sid}|${rev}|${m.key}`):[v]});ux.sources=[...new Set([...ux.sources,...expanded])];closeDialog();writePage();}
 else if(action==='remove-source'){ux.sources.splice(Number(b.dataset.index),1);writePage();}
 else if(action==='search-add'){if(!ux.sources.includes(b.dataset.source))ux.sources.push(b.dataset.source);fullSearch(route()[1]||'');toast('已加入成文来源，保留所选版本');}
 else if(action==='add-note-source'){ux.sources=[...new Set([...ux.sources,`note||${id}`])];nav('#/write');}
 else if(action==='add-member-source'){ux.sources=[...new Set([...ux.sources,`${id}|${b.dataset.rev}|${b.dataset.key}`])];nav('#/write');}
 else if(action==='generate-writing'){if(!ux.sources.length){sourcePicker();return;}ux.intent=$('#ux-write-intent')?.value||ux.intent;ux.composeState='generating';const token=ux.writeToken=(ux.writeToken||0)+1;writePage();setTimeout(()=>{if(ux.writeToken!==token)return;ux.composeState=ux.scenario==='invalid'?'failed':'ready';ux.composeText='# 平台设计实施前审查说明\n\n## 目标与范围\n\n'+(ux.intent||'根据固定来源整理设计目标、责任边界与验收证据。')+'\n\n## 关键边界\n\n需求、任务执行、验收与归档分别负责自己的状态。修改可编辑笔记副本，不改变原成果集版本。\n\n## 待验证内容\n\n重试与中断恢复应保留人工修改；正式交付须独立审查并记录批准依据。\n\n## 来源\n\n'+ux.sources.map(v=>'- '+sourceTitle(v)+'（固定示例版本）').join('\n');if(route()[0]==='write')writePage();},1000);}
 else if(action==='toggle-write-editor'){ux.writeEdit=!ux.writeEdit;writePage();}
 else if(action==='save-writing'){if(!ux.composeText.trim()){toast('正文不能为空');return;}const nid='composed-demo';let n=getNote(nid);if(!n){n={id:nid,title:'平台设计实施前审查说明',description:'基于固定来源整理的独立文档。',date:'刚刚',time:'',minutes:3,type:'独立草稿',tags:['设计审查']};notes.unshift(n);}n.body=ux.composeText;ux.composeState='saved';nav('#/note/'+nid);toast('已保存到原型笔记；来源内容保持不变');}
 else if(action==='import')importDialog();
 else if(action==='import-confirm'){const files=[...($('#ux-import-files').files||[])];if(!files.length){toast('请选择 Markdown 文件');return;}const output=[];for(const [i,file]of files.entries()){if(!/\.(md|markdown)$/i.test(file.name)){output.push(esc(file.name)+'：格式不支持');continue;}const body=await file.text();const nid='import-'+Date.now()+'-'+i;notes.unshift({id:nid,title:file.name.replace(/\.(md|markdown)$/i,''),type:'Markdown 导入',body,description:'原文与链接完整保留；配套附件未上传。',date:'刚刚',time:'',minutes:2,tags:['导入']});ux.imported.push({id:nid,filename:file.name,original:body});output.push(`<a class="ux-row" href="#/note/${nid}" data-close>${esc(file.name)} · 已导入原型 ${icon('arrow',true)}</a>`);}$('#ux-import-result').innerHTML=output.join('');toast('仅保存到原型页面内存，刷新后重置');}
 else if(action==='topic-new'||action==='topic-edit'){const t=getTopic(id);dialog(t?'编辑专题':'创建专题',`<label class="ux-field">名称<input id="ux-topic-name" value="${esc(t?.title||'')}"></label><label class="ux-field">说明<textarea id="ux-topic-description">${esc(t?.description||'')}</textarea></label><p class="ux-help">创建后先添加已有成果集或独立文档；高级关联规则放在管理区。</p>`,`${uxBtn('topic-save','保存专题',`data-id="${id||''}"`,true)}`);}
 else if(action==='topic-save'){const title=$('#ux-topic-name').value.trim();if(!title){toast('请输入专题名称');return;}let t=getTopic(id);if(!t){t={id:'topic-'+Date.now(),setIds:[],noteIds:[],icon:'topic'};topics.push(t);}t.title=title;t.description=$('#ux-topic-description').value;closeDialog();nav('#/topic/'+t.id);}
 else if(action==='topic-add'){dialog('添加已有内容',`<p>分别选择成果集和独立文档。添加成果集后显式选择跟随归档或固定版本。</p>${sets.map(s=>`<label class="ux-choice"><input name="ux-topic-set" type="checkbox" value="${s.id}" ${getTopic(id).setIds.includes(s.id)?'checked':''}><span>${s.title}<small>整套内容 · 保留自己的目录与版本</small></span></label>`).join('')}${notes.map(n=>`<label class="ux-choice"><input name="ux-topic-note" type="checkbox" value="${n.id}" ${getTopic(id).noteIds.includes(n.id)?'checked':''}><span>${esc(n.title)}<small>独立文档</small></span></label>`).join('')}`,uxBtn('topic-add-save','保存关联',`data-id="${id}"`,true));}
 else if(action==='topic-add-save'){const t=getTopic(id);t.setIds=$$('input[name="ux-topic-set"]:checked').map(n=>n.value);t.noteIds=$$('input[name="ux-topic-note"]:checked').map(n=>n.value);closeDialog();render();}
 else if(action==='topic-rules')dialog('关联规则与候选',`<p>关联规则辅助发现内容；已有成果集按稳定身份引用，不按相似标题自动拼套。</p><label class="ux-field">关键词<input value="需求、任务、验收、平台设计"></label><label class="ux-field">候选处理<select><option>先预览再确认关联</option></select></label><div class="ux-status">候选：失败恢复中的三个关键问题<br>关联依据：命中验收与可靠性主题；尚未加入当前专题。</div>`,uxBtn('rules-save','保存示例规则','',true));
 else if(action==='rules-save'){closeDialog();toast('已保存示例规则；候选不因此自动成为成果集成员');}
 else if(action==='topic-references')dialog('参考资料目录',`<p>原始对话、外部链接与固定快照作为参考资料呈现。目录可以分组排序，不影响成果集内的成员顺序。</p><div class="ux-row"><span>设计讨论与原始需求 · 原始对话</span>${uxBtn('reference-open','查看')}</div><div class="ux-row"><span>协议规范说明 · 外部链接</span><span class="badge draft">离线未收录</span></div>`,`<button class="btn" data-action="close-dialog">返回专题</button>`);
 else if(action==='reference-open')source('platform');
 else if(action==='topic-delete')dialog('删除专题？',`<p>删除组织关系，不删除独立文档或外部成果集原件。受管对象、快照或进行中的操作需要先完成影响检查。</p><label class="ux-field">输入专题名称确认<input id="ux-delete-name" placeholder="${esc(getTopic(id).title)}"></label>`,uxBtn('topic-delete-confirm','确认删除示例专题',`data-id="${id}"`));
 else if(action==='topic-delete-confirm'){if($('#ux-delete-name').value!==getTopic(id).title){toast('名称不一致，未删除');return;}topics.splice(topics.findIndex(t=>t.id===id),1);closeDialog();nav('#/topics');}
 else if(action==='save-settings'){if($('#ux-model'))ux.settings.model=$('#ux-model').value;if($('#ux-endpoint'))ux.settings.endpoint=$('#ux-endpoint').value;toast('已保存原型内的示例选择；未修改真实配置');}
 else if(action==='test-model')uxNotice('连接检查示例','连接可用 · 所需接口能力已核对（模拟）。产品中需区分连接成功与 JSON 输出能力；不可因 HTTP 200 就宣称归档成功。');
 else if(action==='sync-preview')uxNotice('同步范围预览','示例：2 篇独立文档、1 套当前成果及其必要投影与资源。Git 状态、同步失败与内容保存状态分别显示。');
 else if(action==='index-preview')uxNotice('重建索引前核对','预计处理 20 篇可读正文。词法与向量任务分开记录；执行可能调用外部向量服务。',`${uxBtn('index-confirm','确认重建示例索引','',true)}`);
 else if(action==='index-confirm'){closeDialog();toast('已模拟创建索引任务，未调用外部服务');}
 else if(action==='profile-detail')uxNotice('工程设计成果集 Profile','自动匹配适用范围；共同设计契约与成员角色冻结到版本。模板维护与归档对话分离，普通用户无需逐篇配置。');
 else if(action==='activity')dialog('后台活动与调用记录',`<p>按内容目标区分任务，不用最新任务状态替换旧内容状态。</p><ol class="ux-task-steps"><li>平台设计归档 <small>已保存 · 6 篇正文</small></li><li>平台设计更新 <small>本次失败 · 旧成果可读</small></li><li>搜索索引 <small>处理中 · 保存不受影响</small></li></ol><details style="margin-top:18px"><summary>查看调用诊断</summary><p class="ux-help">请求 ID、阶段、模型、耗时、输入／输出与缓存统计。无关事件不改变当前任务身份。</p></details>`,`<a class="btn" href="#/settings/index" data-close>管理后台任务</a>`);
 else if(action==='metrics')uxNotice('模型调用统计','按模型与任务查看调用次数、耗时、输入／输出 token、已知缓存 token 及未知统计。未知缓存不当作已证实的 0%。');
 else if(action==='backup-preview')dialog('导出备份前核对',`<p>备份用于恢复工作区内容与必要的版本关系。外部引用不代表包内已包含对方正文。</p><div class="ux-status">范围：专题、当前内容、保留版本、必要资源及引用策略。<br>不等同阅读下载或正式交付包。</div>`,uxBtn('backup-confirm','生成示例备份清单','',true));
 else if(action==='backup-confirm'){closeDialog();download('ThoughtFlow-备份范围-示例.md','# 备份范围预览\n\n这是交互原型示例清单，不是可恢复备份。\n\n- 当前内容与保留版本\n- 必要资源\n- 专题引用策略\n');}
 else if(action==='restore-preview')dialog('恢复前校验与冲突预览',`<p>真实恢复需先选择备份包；此处演示校验结果。</p><div class="ux-status warn">目标“数据与存储”已有不同字节，禁止覆盖。<br>无关对象仍可读取；冲突操作安全终止并保留记录。</div><div class="ux-row"><span>原始对话</span><span class="badge final">可恢复</span></div><div class="ux-row"><span>数据与存储</span><span class="badge draft">目标冲突</span></div><div class="ux-row"><span>外部成果集引用</span><span class="badge draft">目标未打包</span></div>`,`<button class="btn" data-action="close-dialog">取消恢复</button>${uxBtn('restore-blocked','继续恢复','disabled')}`);
 else if(action==='review')reviewDialog();
 else if(action==='record-review'){if(!$('#ux-risk-check').checked||!$('#ux-risk-reason').value.trim()){toast('请勾选并填写风险处置说明');return;}ux.reviewed=true;reviewDialog();toast('已记录当前候选的示例风险处置');}
 else if(action==='finalize-preview'){if(!ux.reviewed){toast('仍有风险未处置，请先记录说明');return;}uxNotice('定稿申请确认','身份与权限服务 · 11月04日工作版本 · 5 篇正文。批准内容、证据与交付等级须绑定该固定版本；内容变化后需要重新校验。',`${uxBtn('finalize-confirm','确认示例定稿','',true)}`);}
 else if(action==='finalize-confirm'){closeDialog();toast('已演示定稿确认；正式产品仍由后端门禁决定，不修改真实版本');}
 else if(action==='delivery')dialog('下载与交付方式',`<div class="ux-menu-links"><a href="#" data-ux="reading-download"><strong>阅读用 Markdown</strong><p>当前固定版本正文与来源，不代表批准，不保证配套附件完整。</p></a><a href="#" data-ux="delivery-check"><strong>正式交付包</strong><p>核对定稿等级、来源、离线资源与交付清单后才可下载。</p></a><a href="#/settings/recovery" data-close><strong>工作区备份</strong><p>进入备份恢复流程，不与阅读包混用。</p></a></div>`);
 else if(action==='reading-download'){closeDialog();download('身份服务-阅读说明-示例.md','# 固定版本阅读下载\n\n此为交互原型说明示例。正式产品提供当前所选版本正文与来源 Markdown；不代表正式交付或可恢复备份。');}
 else if(action==='delivery-check')uxNotice('正式交付校验示例','该工作版本尚未获得正式交付批准，暂不可下载正式交付包。可以继续阅读或先完成当前版本审查。',`${uxBtn('review','进入审查','',true)}`);
});

document.addEventListener('click',e=>{const b=e.target.closest('[data-ux]');if(!b)return;const action=b.dataset.ux;
 if(action==='handoff')dialog('工程移交 · 固定设计版本',`<p>将已核对的设计转为开发输入包；不在这里自动创建项目、执行代码或部署。</p><label class="ux-field">开发目标<textarea id="ux-handoff-goal">实现身份认证、授权边界与审计追踪，并提供可核验的验收证据。</textarea></label><label class="ux-field">直接验收要求<textarea>正常与拒绝路径均可观察；凭据与审计数据不能泄露。</textarea></label><label class="ux-field">工程模板<input value="service-starter（示例）"></label><label class="ux-field">目标工作区<input value="由接收方选择（示例）"></label>`,uxBtn('handoff-preview','核对开发输入','',true));
 else if(action==='handoff-preview')dialog('开发输入核对',`<div class="ux-status warn">来源：身份与权限服务 · 固定工作版本。<br>开发目标、验收要求、输入修订号及成员映射需共同确认。<br>仍有未决规范选择时，只能按后端支持的草稿政策处理；不能自动解释为批准。</div><label class="ux-choice"><input id="ux-handoff-confirm" type="checkbox"><span>已核对本次开发输入与对外提供范围<small>修改目标或模板后需要重新预览和确认。</small></span></label>`,uxBtn('handoff-export','导出示例移交说明','',true));
 else if(action==='handoff-export'){if(!$('#ux-handoff-confirm').checked){toast('请先核对开发输入');return;}closeDialog();download('工程移交-示例说明.md','# 工程移交说明\n\n这是交互原型示例，不是真实开发输入包或项目生成结果。\n\n固定来源、目标、验收要求、预算和映射须经真实后端校验后导出。');}
 else if(action==='formal-convert')dialog('转换为正式文档',`<p>可编辑 Thought 转为受 Profile 约束的文档。原始 Markdown 保留；转换不等于审查通过或批准。</p><label class="ux-field">文档规则<select><option>软件功能设计 · v1</option><option>工程方案说明 · v1</option></select></label><p class="ux-help">这是用户主动发起的独立转换；不改变对话归档自动选择 Profile 的流程。</p>`,uxBtn('formal-convert-preview','预览转换影响','',true));
 else if(action==='formal-convert-preview')uxNotice('转换影响预览','保留原文和来源；新增 Profile 版本、必要章节与校验报告。缺失内容显示为待完善，不把渲染成功解释为定稿成功。');
 else if(action==='note-process')uxNotice('来源、处理记录与资源','此区保留原文、URL 提取、整理、索引、扩展建议与资源绑定的可追踪记录。按阶段显示成功、失败和是否可重试；不会遮住阅读正文。');
 else if(action==='share-preview')uxNotice('分享范围确认','产品仅在分享能力启用时显示此操作。分享对象、固定或可变链接、资源可见性与有效范围必须明确；私有候选和 runtime 文件不能随正文公开。');
 else if(action==='note-delete')dialog('删除文档前核对',`<p>独立文档、成果集成员副本与固定原件的影响不同。此处展示删除确认的结构；受管内容以真实后端检查为准。</p><div class="ux-status warn">示例：删除可编辑副本，不会因此删除冻结归档原件；专题中的引用可能变为不可用。</div>`,`<button class="btn" data-action="close-dialog">保留文档</button>${uxBtn('note-delete-confirm','确认示例删除')}`);
 else if(action==='note-delete-confirm'){closeDialog();toast('已演示删除确认；未删除真实或示例内容');}
});

if(!location.hash)location.hash="#/overview";else render();
</script>
</body>
</html>
